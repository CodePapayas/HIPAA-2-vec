# Seed glossary: everyday developer phrasing → the vocabulary the CFR uses.
#
# `notes` are user-facing (list_glossary_terms returns them over MCP, and
# `hipaa-mcp glossary list` prints them). They explain the vocabulary mapping
# and point at where a term is defined. They never state what a regulation
# requires, permits, or means — read the cited text for that.
version: 1
entries:
  # Third-party / vendor relationships
  - term: vendor
    maps_to: business associate
    relationship: synonym
    notes: Developers say "vendor"; the regulations say "business associate" — defined at § 160.103

  - term: subprocessor
